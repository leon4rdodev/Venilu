<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/venilu.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venilu</title>
  </head>
  <body>
    <div id="splash-screen" class="splash-screen">
      <div class="logo-minimal" style="animation: fadeIn 0.4s ease-out forwards;">V</div>
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
    </div>

    <div id="root"></div>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #ffffff;
        transition: opacity 0.8s ease-in-out, visibility 0.8s;
      }
      .splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .logo-minimal {
        font-size: 180px;
        font-weight: 900;
        color: #2563eb;
        letter-spacing: -12px;
        margin-bottom: 2rem;
        opacity: 0;
      }
      .loader-track {
        width: 192px;
        height: 6px;
        background: #f1f5f9;
        overflow: hidden;
        position: relative;
        border-radius: 9999px;
      }
      .loader-bar {
        position: absolute;
        top: 0;
        height: 100%;
        width: 50%;
        background: #3b82f6;
        animation: progress 1s infinite linear;
        border-radius: 9999px;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        will-change: transform;
      }
      @keyframes progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>

    <script>
      window.addEventListener('venilu-ready', () => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(() => splash.remove(), 1000);
        }
      });
    </script>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
