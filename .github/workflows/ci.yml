name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Type-check, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check (renderer)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type-check (main / Electron)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Type-check (tests)
        run: npx tsc -p tsconfig.tests.json --noEmit

      # La suite usa sqlite3 nativo con el Node del runner (no el de Electron).
      # El postinstall (electron-builder install-app-deps) puede dejarlo
      # compilado contra Electron; recompilar aquí garantiza el binario correcto.
      - name: Recompilar sqlite3 para Node
        run: npm rebuild sqlite3

      - name: Tests
        run: npx vitest run

      - name: Build (renderer)
        run: npm run build:react
